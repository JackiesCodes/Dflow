<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Generate every possible outcome combination for N football games and explore them as a workflow graph and table." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Betting Slip Outcome Explorer</title>
    <script>
      try {
        var t = localStorage.getItem('bsoe:theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
